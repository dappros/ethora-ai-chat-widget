name: CI

# Runs on pull requests into main or dev, on pushes to main and by hand.
# Feature branches are also checked locally before they reach dev
# (npm run ci:local, run by .githooks/pre-push). See docs/WORKFLOW.md.
#
# The widget compiles ethora-chat-component from source, so every run checks out
# the chat-component ref from chat-component.ref (see .github/actions/build-env).
# A manual run can build against another ref with the chat_component_ref input.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      chat_component_ref:
        description: 'ethora-chat-component branch, tag or commit to build against. Empty = chat-component.ref.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# A new push to a pull request cancels the superseded run of that pull request.
# Runs on main are never cancelled by a pull request.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, types, rules, build, bundle
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build environment (chat-component source, Node, dependencies)
        id: env
        uses: ./.github/actions/build-env
        with:
          chat-component-ref: ${{ inputs.chat_component_ref }}

      - name: Lint
        run: npm run lint

      - name: Attribute contract
        run: npm run check:attributes

      # tsc reports known errors from chat-component subpath imports. The ratchet
      # fails on any error beyond scripts/typecheck-baseline.json.
      - name: Type check (no new errors)
        run: npm run check:types

      - name: Release script rules and changelog helpers
        run: npm run test:release

      # Readable, not minified: the WordPress.org review requires human-readable JS.
      - name: Build the widget bundle
        run: npx vite build --minify false

      - name: Check the bundle is readable
        run: node scripts/check-bundle.mjs dist/ethora_assistant.js

      # What npm would publish: the dist folder with the bundle and pdf.js. A dry run
      # packs the files without uploading anything.
      - name: Check the package contents
        run: npm run check:package

      - name: Summary
        env:
          CC_REF: ${{ steps.env.outputs.chat-component-ref }}
          CC_SHA: ${{ steps.env.outputs.chat-component-sha }}
        run: |
          {
            echo "### Widget build"
            echo
            echo "- chat-component: \`$CC_REF\` at \`$CC_SHA\`"
            echo "- bundle: $(wc -l < dist/ethora_assistant.js) lines, $(du -h dist/ethora_assistant.js | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The built bundle, for testing a pull request without building it locally.
      - name: Upload the bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: widget-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
