<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ethora launcher preview</title>
    <!--
      Static mirror of the launcher + CTA markup in src/Assistant.tsx. Not part
      of the build and not loaded by anything: it exists so the launcher can be
      eyeballed WITHOUT a 3 MB rebuild. If you change the launcher in
      Assistant.tsx, change it here too, they are deliberately independent
      copies and will otherwise drift.
    -->
    <style>
      body {
        margin: 0;
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fff;
      }
      .stage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
      }
      .half { position: relative; }
      .dark { background: #3f3f42; }
      .light { background: #f7f8fa; }
      .dock { position: absolute; bottom: 40px; right: 40px; }
      .cta {
        position: absolute;
        bottom: 82px;
        right: 0;
        background: #fff;
        color: #333;
        padding: 10px 14px;
        border-radius: 12px;
        border: none;
        box-shadow: 0 4px 16px rgba(0,0,0,.1);
        font-size: 14px;
        line-height: 1.3;
        white-space: nowrap;
        cursor: pointer;
      }
      .cta-close {
        display: inline-flex; align-items: center; justify-content: center;
        width: 20px; height: 20px; margin-left: 2px; border-radius: 50%;
        color: #aab2c0;
      }
      .launcher {
        width: 56px; height: 56px; border-radius: 50%; border: none; padding: 0;
        cursor: pointer; overflow: hidden; color: #fff;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #6e72fc, #ad1deb);
        box-shadow: 0 0 12px rgba(173,29,235,.4);
        animation: pulseGlow 2.5s infinite;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }
      .launcher:hover { transform: scale(1.05); }
      @keyframes pulseGlow {
        0% { box-shadow: 0 0 12px rgba(173,29,235,.4); }
        50% { box-shadow: 0 0 20px rgba(173,29,235,.8); }
        100% { box-shadow: 0 0 12px rgba(173,29,235,.4); }
      }
      .flat .launcher {
        background: #0052CD;
        box-shadow: 0 0 12px rgba(0,82,205,.4);
        animation: none;
      }
      .label {
        position: absolute; top: 20px; left: 24px;
        font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
        color: #9aa3b2; font-weight: 600;
      }
      .dark .label { color: #8d8d93; }
    </style>
  </head>
