<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethora AI Assistant - Demo</title>
    <!--
      New-arch embed contract (single-bot widget over @ethora/chat-component):
        data-app-id            (required) the Ethora app id
        data-bot-id            (back-compat) a bot JID; appId is derived from
                               its prefix when data-app-id is absent
        data-api-url           (optional) API base; default Ethora Cloud
        data-bot-name           (optional) override the bot display name
        data-bot-avatar         (optional) override the bot avatar URL
        data-title / data-greeting-title / data-greeting (optional copy)
    -->
    <script
      src="dist/ethora_assistant.js?v=3"
      id="chat-content-assistant"
      data-app-id="646cc8dc96d4a4dc8f7b2f2d"
      data-api-url="https://api.chat.ethora.com/v1"
      data-bot-name="My Custom Bot"
    ></script>
  </head>
  <body>
    <h1>Ethora AI Assistant - Demo</h1>
    <p>Set a real <code>data-app-id</code> above to load a live assistant.</p>
  </body>
</html>
