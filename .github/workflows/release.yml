name: Release

# Publishes @ethora/ai-chat-widget to npm and attaches the readable bundle
# (dist/ethora_assistant.js) to the GitHub release. The WordPress publish
# workflow downloads that asset from here.
#
# Two ways in:
#   - Push a tag vYY.M.D on main (npm run release -- --yes --push does this locally).
#   - Run this workflow by hand (Actions > Release > Run workflow). It bumps and
#     tags main, then publishes that tag in the same run.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'yy.m.d without leading zeros. Empty = the next date-based version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Manual runs only. A tag pushed with GITHUB_TOKEN does not start other
  # workflows, so the publish jobs live in this file and run after this job.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump, commit, tag and push
        id: bump
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REQUESTED" ]; then
            node scripts/release.mjs --yes --push "$REQUESTED"
          else
            node scripts/release.mjs --yes --push
          fi
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  verify:
    needs: tag
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Read the chat-component ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < chat-component.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out ethora-chat-component at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: dappros/ethora-chat-component
          ref: ${{ steps.ref.outputs.ref }}
          path: .ci/ethora-chat-component

      - name: Install chat-component dependencies
        working-directory: .ci/ethora-chat-component
        run: npm ci --ignore-scripts

      - name: Link chat-component where vite.config.ts looks for it
        run: ln -sfn "$GITHUB_WORKSPACE/.ci/ethora-chat-component" "$GITHUB_WORKSPACE/../ethora-chat-component"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag, version, npm and origin/main
        env:
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: node scripts/release.mjs verify "$TAG"

      - name: Local CI checks
        run: npm run ci:local

      - name: Build the widget bundle
        run: npx vite build --minify false

      - name: Check the bundle is readable
        run: node scripts/check-bundle.mjs dist/ethora_assistant.js

  publish:
    # Depends on tag as well as verify, so a manual run sees the tag it created.
    # Without it the tag output is empty and a manual run would publish "main".
    needs: [tag, verify]
    if: ${{ always() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    # Optional approval gate. Create the environment in repo settings with
    # required reviewers to approve every publish.
    environment: npm-release
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Read the chat-component ref
        id: ref
        run: echo "ref=$(tr -d '[:space:]' < chat-component.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out ethora-chat-component at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: dappros/ethora-chat-component
          ref: ${{ steps.ref.outputs.ref }}
          path: .ci/ethora-chat-component

      - name: Install chat-component dependencies
        working-directory: .ci/ethora-chat-component
        run: npm ci --ignore-scripts

      - name: Link chat-component where vite.config.ts looks for it
        run: ln -sfn "$GITHUB_WORKSPACE/.ci/ethora-chat-component" "$GITHUB_WORKSPACE/../ethora-chat-component"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build the widget bundle
        run: npx vite build --minify false

      - name: Check the bundle is readable
        run: node scripts/check-bundle.mjs dist/ethora_assistant.js

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: GitHub release with the bundle attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: |
          CC_SHA="$(git -C .ci/ethora-chat-component rev-parse HEAD)"
          NOTES="Built with ethora-chat-component $(cat chat-component.ref) at $CC_SHA"
          gh release create "$TAG" dist/ethora_assistant.js \
            --title "$TAG" --notes "$NOTES" --verify-tag

      # Starts the WordPress plugin update: that workflow takes the bundle from this
      # release and opens a pull request in the plugin repository. It needs a token that
      # can run workflows there (secret WP_REPO_TOKEN). Without the secret this step only
      # prints what to run by hand. A failure here does not undo the release.
      - name: Start the WordPress plugin update
        continue-on-error: true
        env:
          WP_REPO_TOKEN: ${{ secrets.WP_REPO_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
        run: |
          if [ -z "$WP_REPO_TOKEN" ]; then
            echo "WP_REPO_TOKEN is not set. Run the update-widget workflow in dappros/ethora-wp-plugin with widget_tag=$TAG."
            exit 0
          fi
          GH_TOKEN="$WP_REPO_TOKEN" gh workflow run update-widget.yml \
            --repo dappros/ethora-wp-plugin -f widget_tag="$TAG"
